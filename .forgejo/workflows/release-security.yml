# Forgejo variant of .github/workflows/release-security.yml; keep job logic synchronized.
name: Release security assurance

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Release-candidate tag being evaluated
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_CANDIDATE: ${{ inputs.release_candidate }}

jobs:
  validate-input:
    name: Validate release tag input
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag name
        shell: bash
        run: |
          if [[ ! "$RELEASE_CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_CANDIDATE" >&2
            exit 64
          fi
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed annotated tag
        run: bash scripts/release-evidence.sh "$RELEASE_CANDIDATE"

  fuzz-discovery:
    name: Discovery (${{ matrix.target }})
    needs: validate-input
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
      FUZZ_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [packet, kexinit, ext-info, public-key, signature, private-key, known-hosts, config, zlib, sftp]
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-lisp
      - run: qlot install
      - name: Build Radamsa 0.7
        run: |
          if ! command -v radamsa >/dev/null 2>&1; then
            radamsa_build_dir=$(mktemp -d)
            trap 'rm -rf "$radamsa_build_dir"' EXIT
            curl --fail --location --silent --show-error \
              https://gitlab.com/akihe/radamsa/uploads/d774a42f7893012d0a56c490a75ae12b/radamsa-0.7.c.gz \
              -o "$radamsa_build_dir/radamsa.c.gz"
            gzip --decompress --stdout "$radamsa_build_dir/radamsa.c.gz" | \
              cc -O2 -x c -o "$radamsa_build_dir/radamsa" -
            if command -v sudo >/dev/null 2>&1; then
              sudo install --mode=0755 "$radamsa_build_dir/radamsa" /usr/local/bin/radamsa
            else
              install --mode=0755 "$radamsa_build_dir/radamsa" /usr/local/bin/radamsa
            fi
          fi
      - name: Fifteen-minute coverage-guided discovery
        run: |
          SSH_FUZZ_DURATION_SECONDS=900 SSH_FUZZ_COVERAGE_FEEDBACK=1 \
            bash scripts/run-fuzz.sh mutate "$FUZZ_TARGET"
      - name: Thirty-minute coverage plateau
        shell: bash
        run: |
          status=0
          SSH_FUZZ_DURATION_SECONDS=1800 SSH_FUZZ_COVERAGE_FEEDBACK=1 \
            SSH_FUZZ_REQUIRE_PLATEAU=1 \
            bash scripts/run-fuzz.sh mutate "$FUZZ_TARGET" || status=$?
          classification=$(bash scripts/run-fuzz.sh classify "$status")

          case "$classification" in
            success)
              ;;
            coverage-growth)
              echo "Coverage grew; extending this target by two CPU-hours."
              SSH_FUZZ_DURATION_SECONDS=7200 SSH_FUZZ_COVERAGE_FEEDBACK=1 \
                bash scripts/run-fuzz.sh mutate "$FUZZ_TARGET"

              final_status=0
              SSH_FUZZ_DURATION_SECONDS=1800 SSH_FUZZ_COVERAGE_FEEDBACK=1 \
                SSH_FUZZ_REQUIRE_PLATEAU=1 \
                bash scripts/run-fuzz.sh mutate "$FUZZ_TARGET" || final_status=$?
              final_classification=$(bash scripts/run-fuzz.sh classify "$final_status")
              if [ "$final_classification" = coverage-growth ]; then
                echo "coverage still grew during the final plateau" >&2
                exit 10
              elif [ "$final_classification" = fault ]; then
                exit "$final_status"
              fi
              ;;
            fault)
              exit "$status"
              ;;
          esac

          bash scripts/run-fuzz.sh verify "$FUZZ_TARGET"
      - run: bash scripts/run-fuzz.sh coverage
      # Forgejo requires the v3 artifact protocol, as in ci.yml.
      - uses: https://data.forgejo.org/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        if: always()
        with:
          name: release-fuzz-${{ matrix.target }}
          path: .fuzz-output
          if-no-files-found: ignore

  validation:
    name: Release tests (${{ matrix.implementation }})
    needs: validate-input
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: [sbcl-bin, ecl]
    env:
      LISP: ${{ matrix.implementation }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-lisp
      - run: qlot install
      - name: Compile and test
        run: |
          qlot exec ros -Q -e \
            '(progn
               (asdf:compile-system :ssh :force t)
               (asdf:test-system :ssh))' \
            2>&1 | tee "test-${{ matrix.implementation }}.log"
      - uses: https://data.forgejo.org/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        if: always()
        with:
          name: release-test-${{ matrix.implementation }}
          path: test-${{ matrix.implementation }}.log

  integration:
    name: Release Docker integration
    needs: validate-input
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-lisp
      - run: qlot install
      - run: bash scripts/run-integration-tests.sh 2>&1 | tee integration.log
      - uses: https://data.forgejo.org/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        if: always()
        with:
          name: release-integration
          path: integration.log

  secrets:
    name: Release secret scan
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-evidence:
    name: Signed-tag release evidence
    needs: [fuzz-discovery, validation, integration, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          # v3 downloads all artifacts into one subdirectory per artifact.
          path: dist/evidence
      - name: Bundle run evidence
        run: |
          cd dist
          tar -czf release-run-evidence.tar.gz evidence
      - name: Verify tag and build release files
        run: bash scripts/release-evidence.sh "$RELEASE_CANDIDATE"
      - uses: https://data.forgejo.org/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: release-evidence
          path: dist
      - name: Publish release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_CANDIDATE" \
            "dist/cl-ssh-$RELEASE_CANDIDATE.tar.gz" \
            dist/SHA256SUMS \
            dist/tag.txt \
            dist/tag-verification.txt \
            dist/release-run-evidence.tar.gz \
            --title "$RELEASE_CANDIDATE" \
            --generate-notes
