name: Fuzzing

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
      FUZZ_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [packet, kexinit, ext-info, public-key, signature, private-key, known-hosts, config, zlib, sftp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - run: qlot install
      - name: Build Radamsa 0.7
        run: |
          if ! command -v radamsa >/dev/null 2>&1; then
            radamsa_build_dir=$(mktemp -d)
            trap 'rm -rf "$radamsa_build_dir"' EXIT
            curl --fail --location --silent --show-error \
              https://gitlab.com/akihe/radamsa/uploads/d774a42f7893012d0a56c490a75ae12b/radamsa-0.7.c.gz \
              -o "$radamsa_build_dir/radamsa.c.gz"
            gzip --decompress --stdout "$radamsa_build_dir/radamsa.c.gz" | \
              cc -O2 -x c -o "$radamsa_build_dir/radamsa" -
            if command -v sudo >/dev/null 2>&1; then
              sudo install --mode=0755 "$radamsa_build_dir/radamsa" /usr/local/bin/radamsa
            else
              install --mode=0755 "$radamsa_build_dir/radamsa" /usr/local/bin/radamsa
            fi
          fi
      - name: Mutate with coverage feedback
        run: |
          SSH_FUZZ_ITERATIONS=10 SSH_FUZZ_COVERAGE_FEEDBACK=1 \
            bash scripts/run-fuzz.sh mutate "$FUZZ_TARGET"
      - name: Reject retained faults
        run: bash scripts/run-fuzz.sh verify "$FUZZ_TARGET"
      - run: bash scripts/run-fuzz.sh coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: .fuzz-output
          include-hidden-files: true
          if-no-files-found: error
