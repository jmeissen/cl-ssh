name: Release

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Release-candidate tag being evaluated
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RELEASE_CANDIDATE: ${{ inputs.release_candidate }}

jobs:
  validate-input:
    name: Validate release tag input
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag name
        shell: bash
        run: |
          if [[ ! "$RELEASE_CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_CANDIDATE" >&2
            exit 64
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Verify signed annotated tag
        run: bash scripts/release-evidence.sh "$RELEASE_CANDIDATE"

  core:
    name: Core (${{ matrix.implementation }})
    needs: validate-input
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: [sbcl-bin, ecl]
    env:
      LISP: ${{ matrix.implementation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - run: qlot install
      - name: Compile and run portable tests
        run: |
          qlot exec ros -Q -e \
            '(progn
               (asdf:compile-system :ssh :force t)
               (asdf:test-system :ssh))'

  lint:
    name: Lisp lint
    needs: validate-input
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - run: qlot install
      - run: qlot exec ros install cxxxr/sblint
      - run: qlot exec sblint ssh.asd

  integration:
    name: Docker integration
    needs: validate-input
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - run: qlot install
      - name: Install integration test prerequisites
        run: |
          if ! command -v ssh-keyscan >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-client
          fi
      - run: bash scripts/run-integration-tests.sh

  fuzz-replay:
    name: Fuzz corpus replay
    needs: validate-input
    runs-on: ubuntu-latest
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-lisp
      - run: qlot install
      - run: bash scripts/test-fuzz-driver.sh
      - run: bash scripts/run-fuzz.sh replay
      - run: bash scripts/run-fuzz.sh verify
      - run: bash scripts/run-fuzz.sh coverage

  secrets:
    name: Secret scan
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: git --config .gitleaks.toml --redact --verbose .

  publish:
    name: Publish release
    needs: [core, lint, integration, fuzz-replay, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.release_candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and prepare source archive
        run: bash scripts/release-evidence.sh "$RELEASE_CANDIDATE"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_CANDIDATE" \
            "dist/cl-ssh-$RELEASE_CANDIDATE.tar.gz" \
            --verify-tag \
            --title "$RELEASE_CANDIDATE" \
            --generate-notes
